# ARIA deployment configuration.
# Addresses and credentials come from .env; this file holds the behaviour that varies per deployment:
# model capability profiles, limits, backend contract paths and timeouts.

service:
  name: aria
  # Run the preflight in the background at startup and expose its result on /health.
  preflight_on_startup: true

backend:
  openapi_path: /v3/api-docs
  metadata_schema_path: /api/metadata/schema

# Request-path calls to other services. Every call has a short timeout and an explicit retry budget.
http:
  connect_timeout_seconds: 3.0
  read_timeout_seconds: 10.0
  retries: 1

preflight:
  timeout_seconds: 8.0

# Per-model capability profiles, keyed by the model name configured in .env
# (MODEL_NAME for the tool/routing role, GENERAL_MODEL_NAME for synthesis).
# context_tokens is the per-request context ARIA asks the host for; prompts are budgeted against
# input_budget_tokens and never exceed context_tokens - max_output_tokens.
models:
  profiles:
    # llama-server with 4 slots of 16,384 tokens, measured 2026-10-30: about 17 output tokens/s and
    # about 82 uncached prompt tokens/s, so the input budget is kept well below the slot context.
    "qwen3.6-35b-a3b-ud-q4_k_xl":
      provider: llama_cpp
      context_tokens: 16384
      input_budget_tokens: 6144
      max_output_tokens: 1024
      tool_calling: true
      structured_output: true
      output_tokens_per_second: 17
      max_tools_per_call: 10
      shortlist_k: 10
      timeout_seconds: 90
    "qwen2.5:7b":
      provider: ollama
      context_tokens: 8192
      input_budget_tokens: 4096
      max_output_tokens: 512
      tool_calling: true
      structured_output: true
      output_tokens_per_second: 15
      max_tools_per_call: 8
      shortlist_k: 8
      timeout_seconds: 45
    "llama3.1:8b":
      provider: ollama
      context_tokens: 8192
      input_budget_tokens: 4096
      max_output_tokens: 768
      tool_calling: true
      structured_output: true
      output_tokens_per_second: 15
      max_tools_per_call: 8
      shortlist_k: 8
      timeout_seconds: 60

# Registered tools, declared keys and operation bindings.
catalog_file: tools.yaml

# Model instructions, until the prompts database is reachable.
prompts_file: prompts.yaml
