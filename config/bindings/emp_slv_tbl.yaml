# Bindings for the tools in tools/emp_slv_tbl.py.
fetchEmpShortLeavesByAttDtId:
  operation:
    method: get
    path: /api/emp-short-leaves/date/{attDtId}
fetchEmpShortLeavesByEmpNo:
