# Tool catalog: registered tool modules, declared business keys and chain limits.
# Each module's tools are bound to backend operations in bindings/<module>.yaml. Operations are
# named by method and path because springdoc's generated operationIds change when unrelated
# controllers change. Only declared keys link tools.
